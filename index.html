
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gopal Singh Video Tools</title>
<style>
body{margin:0;font-family:Arial;background:#10172a;color:white;text-align:center}
header{background:#075ee8;padding:22px}
h1{margin:5px}
.container{padding:15px;max-width:600px;margin:auto}
.tool{background:#202d48;padding:18px;margin:15px 0;border-radius:15px}
button{background:#087cf5;color:white;border:0;padding:12px;margin:5px;border-radius:8px;font-size:15px}
input{max-width:95%;margin:10px;padding:9px}
video{width:100%;background:black;border-radius:10px;margin-top:10px}
a{color:#50d5ff}
</style>
</head>
<body>
<header>
<h1>Gopal Singh Tools</h1>
<p>Free Online Video Editing Tools</p>
</header>

<div class="container">
<div class="tool">
<h2>1. Video Cutter</h2>
<input type="file" id="cutFile" accept="video/*">
<br>Start Time (Seconds)
<input type="number" id="start" value="0" min="0">
<br>End Time (Seconds)
<input type="number" id="end" value="10" min="1">
<button onclick="cutVideo()">Cut Video & Export</button>
</div>

<div class="tool">
<h2>2. Video Merger</h2>
<input type="file" id="merge1" accept="video/*">
<p>पहला वीडियो</p>
<input type="file" id="merge2" accept="video/*">
<p>दूसरा वीडियो</p>
<button onclick="mergeVideos()">दोनों वीडियो जोड़ें</button>
</div>

<div class="tool">
<h2>3. Extract Audio</h2>
<input type="file" id="audioFile" accept="video/*">
<button onclick="extractAudio()">Audio निकालें</button>
</div>

<div class="tool">
<h2>4. Add Text on Video</h2>
<input type="file" id="textFile" accept="video/*">
<br>
<input id="videoText" placeholder="अपना टेक्स्ट लिखें">
<button onclick="addTextVideo()">Text लगाकर वीडियो बनाएँ</button>
</div>

<div class="tool">
<h2>5. Video Download</h2>
<input type="file" id="downloadFile" accept="video/*">
<button onclick="downloadVideo()">Download Video</button>
</div>

<div class="tool">
<h2>Video Preview</h2>
<video id="preview" controls playsinline></video>
<p id="status">अपना वीडियो चुनें</p>
<a id="result" style="display:none" download="GopalSinghVideo.webm">वीडियो डाउनलोड करें</a>
</div>
</div>

<script>
const preview=document.getElementById('preview');
const statusText=document.getElementById('status');
const result=document.getElementById('result');

function setStatus(t){statusText.textContent=t}
function showFile(file){
 if(!file)return;
 preview.src=URL.createObjectURL(file);
 preview.load();
 setStatus("वीडियो तैयार है");
}
function saveBlob(blob,name){
 const url=URL.createObjectURL(blob);
 result.href=url;
 result.download=name;
 result.style.display='inline-block';
 result.textContent='यहाँ क्लिक करके डाउनलोड करें';
 preview.src=url;
 setStatus("काम पूरा हुआ!");
}

async function recordVideo(files,from,to,text,audioOnly=false){
 if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){
  alert("आपका ब्राउज़र वीडियो एक्सपोर्ट सपोर्ट नहीं करता।");
  return;
 }
 const video=preview;
 const canvas=document.createElement('canvas');
 canvas.width=1280;canvas.height=720;
 const ctx=canvas.getContext('2d');
 const stream=canvas.captureStream(30);
 let audioCtx;
 let audioDest;
 try{
  audioCtx=new AudioContext();
  const source=audioCtx.createMediaElementSource(video);
  audioDest=audioCtx.createMediaStreamDestination();
  source.connect(audioDest);
  source.connect(audioCtx.destination);
  audioDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  await audioCtx.resume();
 }catch(e){console.log(e)}
 const tracks=audioOnly?audioDest.stream:stream;
 let mime='video/webm;codecs=vp9,opus';
 if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
 if(audioOnly)mime='audio/webm';
 const recorder=new MediaRecorder(tracks,{mimeType:mime});
 const chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 const done=new Promise(resolve=>recorder.onstop=()=>resolve());
 recorder.start();

 try{
  for(let i=0;i<files.length;i++){
   video.src=URL.createObjectURL(files[i]);
   await new Promise(resolve=>{
    video.onloadedmetadata=resolve;
    video.load();
   });
   await video.play();
   const start=i===0?from:0;
   const end=i===0?Math.min(to,video.duration):video.duration;
   video.currentTime=start;
   await new Promise(resolve=>{
    const check=()=>{
     if(video.currentTime>=end || video.ended){
      video.pause();resolve();
     }else{
      if(!audioOnly){
       ctx.drawImage(video,0,0,1280,720);
       if(text){
        ctx.font='bold 48px Arial';
        ctx.fillStyle='white';
        ctx.textAlign='center';
        ctx.fillText(text,640,650);
       }
      }
      requestAnimationFrame(check);
     }
    };
    video.addEventListener('seeked',function first(){
     video.removeEventListener('seeked',first);
     check();
    });
   });
  }
 }catch(e){console.log(e)}
 recorder.stop();
 await done;
 if(audioCtx)await audioCtx.close();
 saveBlob(new Blob(chunks,{type:mime}),audioOnly?'GopalSinghAudio.webm':'GopalSinghVideo.webm');
}

async function cutVideo(){
 const f=document.getElementById('cutFile').files[0];
 if(!f)return alert('पहले वीडियो चुनें');
 showFile(f);
 await recordVideo([f],Number(start.value),Number(end.value),'');
}
async function mergeVideos(){
 const a=document.getElementById('merge1').files[0];
 const b=document.getElementById('merge2').files[0];
 if(!a||!b)return alert('दोनों वीडियो चुनें');
 await recordVideo([a,b],0,999999,'');
}
async function extractAudio(){
 const f=document.getElementById('audioFile').files[0];
 if(!f)return alert('वीडियो चुनें');
 showFile(f);
 await recordVideo([f],0,999999,'',true);
}
async function addTextVideo(){
 const f=document.getElementById('textFile').files[0];
 const t=document.getElementById('videoText').value;
 if(!f||!t)return alert('वीडियो और टेक्स्ट दोनों डालें');
 await recordVideo([f],0,999999,t);
}
function downloadVideo(){
 const f=document.getElementById('downloadFile').files[0];
 if(!f)return alert('वीडियो चुनें');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(f);
 a.download=f.name;
 a.click();
 setStatus('वीडियो डाउनलोड शुरू हुआ');
}
</script>
</body>
</html>
