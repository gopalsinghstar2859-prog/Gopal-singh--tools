        
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gopal Singh Tools - Screen Recorder</title>

<script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#141e30,#243b55);
  color: white;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  background: #ffffff;
  color: #222;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 8px 30px #0005;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  color: #6c35d8;
  font-size: 27px;
  margin-bottom: 10px;
}

header p {
  color: #666;
}

.preview {
  width: 100%;
  height: 250px;
  background: #111;
  border-radius: 12px;
  margin-bottom: 20px;
  object-fit: contain;
}

.timer {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  color: #6c35d8;
  margin: 15px;
}

.options {
  background: #f4f0ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.options label {
  display: block;
  margin: 10px 0;
  font-size: 15px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

button {
  border: none;
  padding: 14px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.start { background: #16a34a; }
.pause { background: #e99a12; }
.stop { background: #dc2626; }
.download { background: #6c35d8; }
.resume { background: #087ea4; }

.status {
  text-align: center;
  margin: 18px 0;
  color: #555;
  font-weight: bold;
}

footer {
  text-align: center;
  color: #888;
  margin-top: 22px;
  font-size: 13px;
}

@media(max-width:480px) {
  .container { padding: 17px; }
  header h1 { font-size: 22px; }
  .preview { height: 190px; }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🎥 Gopal Singh Tools</h1>
  <p>Free Online Screen Recorder</p>
</header>

<video id="preview" class="preview" autoplay muted playsinline></video>

<div class="timer" id="timer">00:00:00</div>

<div class="options">
  <h3>Recording Settings</h3>

  <label>
    <input type="checkbox" id="systemAudio" checked>
    Record Screen Audio (if supported)
  </label>

  <label>
    <input type="checkbox" id="microphone">
    Record Microphone
  </label>
</div>

<div class="buttons">
  <button class="start" id="startBtn">▶ Start Recording</button>
  <button class="pause" id="pauseBtn" disabled>⏸ Pause</button>
  <button class="resume" id="resumeBtn" disabled>▶ Resume</button>
  <button class="stop" id="stopBtn" disabled>⏹ Stop</button>
  <button class="download" id="downloadBtn" disabled>
    ⬇ Download Video
  </button>
</div>

<div class="status" id="status">Ready to record</div>

<footer>
  © 2026 Gopal Singh Tools | Free Screen Recorder
</footer>

</div>

<script>
const preview = document.getElementById("preview");
const timer = document.getElementById("timer");
const statusText = document.getElementById("status");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resumeBtn = document.getElementById("resumeBtn");
const stopBtn = document.getElementById("stopBtn");
const downloadBtn = document.getElementById("downloadBtn");

let recorder;
let screenStream;
let microphoneStream;
let recordingStream;
let recordedBlob;
let elapsed = 0;
let timerInterval;
let isStopping = false;

function updateTimer() {
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;

  timer.textContent =
    String(h).padStart(2,"0") + ":" +
    String(m).padStart(2,"0") + ":" +
    String(s).padStart(2,"0");
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsed++;
    updateTimer();
  }, 1000);
}

function cleanupStreams() {
  if (screenStream) {
    screenStream.getTracks().forEach(track => track.stop());
  }

  if (microphoneStream) {
    microphoneStream.getTracks().forEach(track => track.stop());
  }

  if (recordingStream) {
    recordingStream.getTracks().forEach(track => track.stop());
  }

  preview.srcObject = null;
}

startBtn.addEventListener("click", async () => {
  try {
    startBtn.disabled = true;
    statusText.textContent = "Requesting screen permission...";

    recordedBlob = null;
    elapsed = 0;
    updateTimer();

    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: document.getElementById("systemAudio").checked
    });

    let tracks = [
      ...screenStream.getVideoTracks(),
      ...screenStream.getAudioTracks()
    ];

    if (document.getElementById("microphone").checked) {
      microphoneStream = await navigator.mediaDevices.getUserMedia({
        audio: true
      });

      tracks.push(...microphoneStream.getAudioTracks());
    }

    recordingStream = new MediaStream(tracks);

    preview.srcObject = screenStream;
    await preview.play();

    recorder = RecordRTC(recordingStream, {
      type: "video",
      mimeType: "video/webm",
      recorderType: RecordRTC.MediaStreamRecorder,
      bitsPerSecond: 2500000
    });

    recorder.startRecording();

    isStopping = false;
    startTimer();

    pauseBtn.disabled = false;
    stopBtn.disabled = false;
    resumeBtn.disabled = true;
    downloadBtn.disabled = true;

    statusText.textContent = "🔴 Recording in progress";

    screenStream.getVideoTracks()[0].addEventListener(
      "ended", stopRecording
    );

  } catch (error) {
    cleanupStreams();
    startBtn.disabled = false;
    statusText.textContent = "Error: " + error.message;
  }
});

pauseBtn.addEventListener("click", () => {
  if (!recorder || isStopping) return;

  recorder.pauseRecording();
  clearInterval(timerInterval);

  pauseBtn.disabled = true;
  resumeBtn.disabled = false;
  statusText.textContent = "Recording paused";
});

resumeBtn.addEventListener("click", () => {
  if (!recorder || isStopping) return;

  recorder.resumeRecording();
  startTimer();

  pauseBtn.disabled = false;
  resumeBtn.disabled = true;
  statusText.textContent = "🔴 Recording in progress";
});

function stopRecording() {
  if (!recorder || isStopping) return;

  isStopping = true;
  clearInterval(timerInterval);

  pauseBtn.disabled = true;
  resumeBtn.disabled = true;
  stopBtn.disabled = true;

  statusText.textContent = "Preparing your video...";

  recorder.stopRecording(() => {
    recordedBlob = recorder.getBlob();

    preview.srcObject = null;
    preview.src = URL.createObjectURL(recordedBlob);
    preview.controls = true;
    preview.muted = false;
    preview.play().catch(() => {});

    cleanupStreams();

    downloadBtn.disabled = false;
    startBtn.disabled = false;

    statusText.textContent = "✅ Recording completed!";
  });
}

stopBtn.addEventListener("click", stopRecording);

downloadBtn.addEventListener("click", () => {
  if (!recordedBlob) return;

  const url = URL.createObjectURL(recordedBlob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Gopal-Singh-Screen-Recording.webm";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>

</body>
</html>
