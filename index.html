
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gopal Singh Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2ff;color:#222}
header{background:#075ee8;color:white;text-align:center;padding:22px}
.container{padding:15px;max-width:650px;margin:auto}
.tool{background:white;padding:18px;margin:15px 0;border-radius:14px;box-shadow:0 3px 12px #0002}
h2{color:#075ee8}
button{background:#087cf5;color:white;border:0;padding:13px;border-radius:8px;font-size:16px;margin:5px;cursor:pointer}
button:disabled{opacity:.5}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:7px;font-size:16px}
video{width:100%;background:black;margin-top:10px;border-radius:8px}
.result{font-weight:bold;color:green}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calc button{margin:0;font-size:20px;padding:17px 5px}
#display{text-align:right;font-size:26px}
</style>
</head>
<body>
<header>
<h1>Gopal Singh Tools</h1>
<p>Free Online Tools</p>
</header>

<div class="container">

<div class="tool">
<h2>🎬 Video Cutting Tool</h2>
<input type="file" id="videoFile" accept="video/*">
<video id="video" controls playsinline></video>

<label>Start Time (Seconds)</label>
<input type="number" id="start" value="0" min="0" step="0.1">

<label>End Time (Seconds)</label>
<input type="number" id="end" value="5" min="0" step="0.1">

<button id="cutBtn" onclick="cutVideo()">✂️ Cut Video & Export</button>
<p id="status">पहले वीडियो अपलोड करें।</p>
<a id="download" style="display:none" download="gopal-cut-video.webm">
<button>⬇️ Download Video</button>
</a>
</div>

<div class="tool">
<h2>🧮 Calculator</h2>
<input id="display" readonly placeholder="0">
<div class="calc">
<button onclick="clearCalc()">C</button>
<button onclick="del()">DEL</button>
<button onclick="add('/')">÷</button>
<button onclick="add('*')">×</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('-')">−</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('+')">+</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="calculate()">=</button>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
</div>
</div>

</div>

<script>
const video=document.getElementById("video");
const fileInput=document.getElementById("videoFile");
const statusText=document.getElementById("status");
const cutBtn=document.getElementById("cutBtn");

let videoURL=null;
let busy=false;

fileInput.addEventListener("change",()=>{
 const file=fileInput.files[0];
 if(!file)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(file);
 video.src=videoURL;
 video.load();
 document.getElementById("download").style.display="none";
 statusText.textContent="वीडियो लोड हो रहा है...";
});

video.addEventListener("loadedmetadata",()=>{
 document.getElementById("start").value=0;
 document.getElementById("end").value=Math.floor(video.duration);
 statusText.textContent="वीडियो तैयार है।";
});

async function cutVideo(){
 if(busy)return;
 if(!video.src || !video.duration){
  alert("पहले वीडियो अपलोड करें");
  return;
 }
 if(!video.captureStream || !window.MediaRecorder){
  alert("आपके ब्राउज़र में वीडियो एक्सपोर्ट की सुविधा उपलब्ध नहीं है। Chrome में कोशिश करें।");
  return;
 }

 const start=Number(document.getElementById("start").value);
 const end=Number(document.getElementById("end").value);

 if(!Number.isFinite(start)||!Number.isFinite(end)||
 start<0||end<=start||end>video.duration){
  alert("सही Start और End Time डालें।");
  return;
 }

 busy=true;
 cutBtn.disabled=true;
 statusText.textContent="वीडियो तैयार हो रहा है...";

 try{
  video.pause();
  video.currentTime=start;

  await new Promise((resolve,reject)=>{
   video.addEventListener("seeked",resolve,{once:true});
   video.addEventListener("error",reject,{once:true});
  });

  const stream=video.captureStream();
  const mime=[
   "video/webm;codecs=vp9,opus",
   "video/webm;codecs=vp8,opus",
   "video/webm"
  ].find(type=>MediaRecorder.isTypeSupported(type));

  if(!mime)throw new Error("WebM recording supported नहीं है।");

  const recorder=new MediaRecorder(stream,{mimeType:mime});
  const chunks=[];

  recorder.ondataavailable=e=>{
   if(e.data.size>0)chunks.push(e.data);
  };

  const stopped=new Promise((resolve,reject)=>{
   recorder.onstop=resolve;
   recorder.onerror=()=>reject(new Error("Recording में समस्या हुई।"));
  });

  recorder.start(250);

  await video.play();

  const timer=setInterval(()=>{
   if(video.currentTime>=end || video.ended){
    clearInterval(timer);
    video.pause();
    if(recorder.state==="recording")recorder.stop();
   }
  },50);

  await stopped;
  stream.getTracks().forEach(track=>track.stop());

  const blob=new Blob(chunks,{type:"video/webm"});
  if(!blob.size)throw new Error("वीडियो खाली है।");

  const url=URL.createObjectURL(blob);
  const link=document.getElementById("download");
  link.href=url;
  link.style.display="inline-block";
  statusText.textContent="वीडियो तैयार है! Download Video दबाएँ।";
 }catch(error){
  statusText.textContent="समस्या: "+error.message;
 }finally{
  busy=false;
  cutBtn.disabled=false;
 }
}

function add(value){
 document.getElementById("display").value+=value;
}
function clearCalc(){
 document.getElementById("display").value="";
}
function del(){
 const d=document.getElementById("display");
 d.value=d.value.slice(0,-1);
}
function calculate(){
 const d=document.getElementById("display");
 try{
  if(!/^[0-9+\-*/.() ]+$/.test(d.value))throw Error();
  const result=Function('"use strict";return ('+d.value+')')();
  if(!Number.isFinite(result))throw Error();
  d.value=result;
 }catch(e){
  d.value="Error";
 }
}
</script>
 
<div style="max-width:450px;margin:20px auto;padding:20px;background:#eef5ff;border-radius:15px;font-family:Arial;text-align:center;">
<h2>Smart Life Helper</h2>
<p>अपनी आमदनी और खर्च लिखें</p>

<input id="income" type="number" placeholder="आज की आमदनी ₹" style="padding:12px;width:90%;margin:8px;">
<input id="expense" type="number" placeholder="आज का खर्च ₹" style="padding:12px;width:90%;margin:8px;">

<button onclick="showBalance()" style="padding:13px;background:#1769d2;color:white;border:0;border-radius:8px;width:100%;">मेरा हिसाब निकालें</button>

<div id="balance" style="margin-top:15px;font-weight:bold;"></div>
</div>

<script>
function showBalance(){
let i=document.getElementById("income").value;
let e=document.getElementById("expense").value;

if(i==="" || e===""){
alert("आमदनी और खर्च दोनों भरें");
return;
}

let saving=Number(i)-Number(e);

document.getElementById("balance").innerHTML=
"आमदनी: ₹"+i+"<br>खर्च: ₹"+e+
"<br>बची हुई रकम: ₹"+saving;
}
</script>
 
</body>
</html>
